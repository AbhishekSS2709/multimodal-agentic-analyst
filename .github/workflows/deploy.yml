name: Deploy to Hugging Face Spaces

# Manual only. Since July 2026 Hugging Face requires a PRO subscription for
# Docker Spaces on its free CPU tier (the API answers 402 Payment Required),
# so running this after every CI pass would just fail. With PRO enabled, run
# it from the Actions tab, or restore the workflow_run trigger.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Skip when HF_TOKEN is not configured
        if: env.HF_TOKEN == ''
        run: echo "::notice::Add an HF_TOKEN repository secret to enable deploys." 

      - uses: actions/checkout@v5
        if: env.HF_TOKEN != ''
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.11"

      - name: Deploy
        if: env.HF_TOKEN != ''
        env:
          GITHUB_SHA: ${{ github.sha }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          pip install "huggingface_hub>=0.25"
          python scripts/deploy_space.py
