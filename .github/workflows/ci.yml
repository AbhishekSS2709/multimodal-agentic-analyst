name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libmagic1 ffmpeg

      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt pytest httpx ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check --isolated --select E9,F63,F7,F82 src tests app.py scripts

      - name: Tests
        run: pytest -q

  docker:
    name: Docker build and smoke test
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # push the README demo to the demo-assets branch
      packages: write   # publish the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build image (downloads models, builds indices)
        run: docker build -t analyst:ci .

      - name: Start container
        run: docker run -d --name analyst -p 7860:7860 analyst:ci

      - name: UI health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:7860/_stcore/health && exit 0
            sleep 2
          done
          docker logs analyst; exit 1

      - name: Agentic query returns a cited answer
        run: |
          body='{"question":"Why are there dispatch delays?","require_approval":true}'
          docker exec analyst curl -sf -X POST http://127.0.0.1:8000/api/v2/query \
            -H 'content-type: application/json' -d "$body" > answer.json
          python3 - <<'PY'
          import json
          r = json.load(open("answer.json"))
          print(json.dumps({k: r[k] for k in ("answer", "specialists", "verification")}, indent=2)[:1500])
          assert r["answer"].strip(), "empty answer"
          assert r["citations"], "no citations: the index is empty or retrieval is broken"
          PY

      - name: Public-demo guard is on
        run: |
          code=$(docker exec analyst curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/upload)
          test "$code" = "403"

      # --- Everything below runs only once the smoke test has passed. -----

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Record README demo
        id: demo
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/record_demo.py --url http://localhost:7860 --out demo
          ffmpeg -loglevel error -y -i demo/demo.webm \
            -vf "setpts=0.6*PTS,fps=8,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
            demo/demo.gif
          ls -la demo

      - name: Publish demo to the demo-assets branch
        if: steps.demo.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp demo/demo.gif demo/demo.png publish/
          cd publish
          git init -q -b demo-assets
          git add demo.gif demo.png
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "README demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-assets

      - name: Publish image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # New packages start private, and private storage on a free account
          # is capped at 500 MB, below this image's size. A tiny image first
          # creates the package so it can be switched to public (free, no cap).
          printf 'FROM busybox\nLABEL org.opencontainers.image.source=https://github.com/%s\n' "$GITHUB_REPOSITORY" \
            | docker build -q -t "$IMAGE:bootstrap" -
          docker push -q "$IMAGE:bootstrap"
          docker tag analyst:ci "$IMAGE:latest"
          docker tag analyst:ci "$IMAGE:${GITHUB_SHA::7}"
          if docker push -q "$IMAGE:latest" && docker push -q "$IMAGE:${GITHUB_SHA::7}"; then
            echo "Published $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Image push failed. If the package is still private, make it public: https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY#*/} -> Package settings -> Change visibility"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker logs analyst || true
